<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proxy Hunter</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131c30;--muted:#9ba9c2;--line:#263550;--accent:#62b5ff;--good:#45d49a;--bad:#ff7373}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3ff;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:25px max(20px,calc((100% - 1180px)/2));background:#101a2d;border-bottom:1px solid var(--line)}h1{margin:0;font-size:25px}header p{margin:5px 0 0;color:var(--muted)}main{max-width:1180px;margin:24px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}.metric{font-size:27px;font-weight:700}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}input,select,button{background:#0d1628;color:#edf3ff;border:1px solid #344662;border-radius:8px;padding:10px 12px}input{min-width:180px;flex:1}button{cursor:pointer;background:#174c7c;border-color:#27699e}button:disabled{opacity:.45;cursor:not-allowed}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:#17243a}.tabs button.active{background:#1d5c91}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600}td a{color:var(--accent)}.table-wrap{overflow:auto}.pill{padding:3px 8px;border-radius:99px;background:#173b35;color:var(--good);font-size:12px}.empty{text-align:center;padding:35px;color:var(--muted)}footer{color:var(--muted);font-size:12px;margin:18px 0 35px}.notice{margin:14px 0;padding:12px;border:1px solid #715c2c;background:#302817;border-radius:9px;color:#f1d99b}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}main{margin-top:14px}.metric{font-size:23px}}
</style></head>
<body><header><h1>🛰️ Proxy Hunter</h1><p>授权 CIDR 范围内的 SOCKS5 / HTTP / HTTPS 代理验证与管理</p></header>
<main>
<div class="notice">仅展示最近一次扫描结果。免费代理不可信，请勿用于账号登录、敏感数据或重要业务。</div>
<section class="stats">
<div class="card"><div class="muted">可用代理协议端点</div><div class="metric" id="total">—</div></div>
<div class="card"><div class="muted">SOCKS5</div><div class="metric" id="socks5">—</div></div>
<div class="card"><div class="muted">HTTP</div><div class="metric" id="http">—</div></div>
<div class="card"><div class="muted">HTTPS</div><div class="metric" id="https">—</div></div>
</section>
<div class="toolbar"><input id="search" placeholder="搜索 IP / 出口 IP"><select id="sort"><option value="latency">延迟从低到高</option><option value="protocol">协议</option><option value="host">IP 地址</option></select><button id="refresh">刷新数据</button><button id="scan">手动启动扫描</button><button id="export">导出当前筛选结果</button></div>
<div class="tabs"><button class="active" data-protocol="all">全部</button><button data-protocol="socks5">SOCKS5</button><button data-protocol="http">HTTP</button><button data-protocol="https">HTTPS</button></div>
<section class="panel"><div class="muted" id="meta">正在加载扫描结果…</div><h3>最近扫描趋势</h3><canvas id="trend" height="110" style="width:100%;height:110px"></canvas><div class="table-wrap"><table><thead><tr><th>协议</th><th>代理地址</th><th>延迟</th><th>出口 IP</th><th>状态</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody></table></div></section>
<footer>GitHub Pages：只读展示。Cloudflare Worker：配置服务端密钥后可手动触发 GitHub Actions。扫描器只处理仓库中明确配置并授权的 CIDR。</footer>
</main>
<script>
let all=[],active='all',summary={},history=[];
const $=id=>document.getElementById(id);
async function load(){ $('meta').textContent='正在读取最新数据…';try{let r=await fetch('/api/data',{cache:'no-store'});if(!r.ok)r=await fetch('./data/results/latest.json?ts='+Date.now());if(!r.ok)throw Error('尚无扫描结果');let d=await r.json();all=Array.isArray(d.proxies)?d.proxies:[];summary=d.summary||{};try{let hr=await fetch('/api/history',{cache:'no-store'});if(!hr.ok)hr=await fetch('./data/results/history.json?ts='+Date.now());history=hr.ok?await hr.json():[]}catch(_){history=[]}$('total').textContent=summary.total_alive??all.length;$('socks5').textContent=summary.socks5??all.filter(x=>x.protocol==='socks5').length;$('http').textContent=summary.http??all.filter(x=>x.protocol==='http').length;$('https').textContent=summary.https??all.filter(x=>x.protocol==='https').length;$('meta').textContent=`最近扫描：${d.checked_at||'未知'} · 扫描主机：${d.scope?.hosts_considered??'—'} · 配置端口：${d.scope?.ports_configured??'—'}`;drawTrend();render()}catch(e){$('meta').textContent=e.message;$('rows').innerHTML='<tr><td colspan="5" class="empty">暂无数据。请先配置授权 CIDR 并运行 GitHub Actions。</td></tr>'}}
function drawTrend(){const c=$('trend'),ctx=c.getContext('2d'),w=c.clientWidth||600,h=110,dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);if(!history.length){ctx.fillStyle='#9ba9c2';ctx.fillText('完成至少一次扫描后显示历史趋势',8,35);return}const values=history.slice().reverse().map(x=>Number(x.total_alive||0)),max=Math.max(1,...values),left=8,right=w-8,top=10,bottom=h-25;ctx.strokeStyle='#344662';ctx.beginPath();ctx.moveTo(left,bottom);ctx.lineTo(right,bottom);ctx.stroke();ctx.strokeStyle='#62b5ff';ctx.lineWidth=2;ctx.beginPath();values.forEach((v,i)=>{const x=left+(values.length===1?0:i*(right-left)/(values.length-1)),y=bottom-(v/max)*(bottom-top);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#9ba9c2';ctx.font='11px system-ui';ctx.fillText('可用协议端点：'+values[values.length-1],left,h-5)}
function render(){let q=$('search').value.trim().toLowerCase();let list=all.filter(x=>(active==='all'||x.protocol===active)&&(!q||`${x.host} ${x.exit_ip} ${x.uri}`.toLowerCase().includes(q)));let s=$('sort').value;list.sort((a,b)=>s==='latency'?a.latency_ms-b.latency_ms:s==='protocol'?a.protocol.localeCompare(b.protocol):a.host.localeCompare(b.host));$('rows').innerHTML=list.length?list.map(x=>`<tr><td><span class="pill">${esc(x.protocol.toUpperCase())}</span></td><td><code>${esc(x.uri)}</code></td><td>${Number(x.latency_ms).toFixed(1)} ms</td><td>${esc(x.exit_ip||'—')}</td><td>可用</td></tr>`).join(''):'<tr><td colspan="5" class="empty">没有符合条件的代理</td></tr>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[data-protocol]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-protocol]').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.protocol;render()});$('search').oninput=render;$('sort').onchange=render;$('refresh').onclick=load;$('export').onclick=()=>{let q=$('search').value.trim().toLowerCase();let list=all.filter(x=>(active==='all'||x.protocol===active)&&(!q||`${x.host} ${x.exit_ip} ${x.uri}`.toLowerCase().includes(q)));let blob=new Blob([list.map(x=>x.uri).join('\n')+'\n'],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='proxy-hunter-filtered.txt';a.click();URL.revokeObjectURL(a.href)};
$('scan').onclick=async()=>{if(location.hostname.endsWith('github.io')){alert('GitHub Pages 为只读面板。请在 GitHub Actions 中手动运行 Proxy Hunter Scan。');return}const token=prompt('请输入 Worker PANEL_API_TOKEN：');if(!token)return;try{let r=await fetch('/api/scan',{method:'POST',headers:{'x-panel-token':token}});let d=await r.json();if(!r.ok)throw Error(d.error||'触发失败');alert('扫描任务已提交，请稍后刷新结果。')}catch(e){alert(e.message)}};
window.addEventListener('resize',drawTrend);load();
</script></body></html>
